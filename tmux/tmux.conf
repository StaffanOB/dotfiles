set-option -sa terminal-overrides ",xterm*:Tc"
set -g mouse on
set -g base-index 1
set-window-option -g mode-keys vi
set -g default-terminal "screen-256color"
set -g status-position top

# ==============================================================================
# VARIABLES
#set -g @tmpr_script_path "/home/staffan/dotfiles/tmux/scripts/tmpr.py"

# toggle mouse mode to allow mouse copy/paste
# set mouse on with prefix m
bind m \
    set -g mouse on \;\
    display 'Mouse: ON'
# set mouse off with prefix M
bind M \
    set -g mouse off \;\
    display 'Mouse: OFF' 

# ==============================================================================
# PLUGINS
# TPM (Tmux Plugin Manager) is automatically installed by setup.sh
# After first tmux launch, press: Prefix + I  (capital i) to install plugins
# Prefix + U to update plugins
# Prefix + alt + u to uninstall plugins not in list

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

# Restore tmux and vim sessions
# <leader>+<ctrl>+s to save
# <leader>+<ctrl>+r to restore
set -g @plugin 'tmux-plugins/tmux-resurrect'    # Preserve tmux environment across system restarts
set -g @plugin 'tmux-plugins/tmux-continuum'    # Continuous saving of tmux environment

set -g @resurrect-capture-pane-contents 'on'  # Save pane contents for easy restoration
set -g @continuum-restore 'on'                  # Restore tmux environment on tmux start
set -g @resurrect-strategy-vim 'session'        # Save and restore vim sessions

set -g @plugin 'staffanob/tmux-toor-zen-theme'

# ==============================================================================
# SCRIPTS

# ==============================================================================
# THEMES
# Theme: Toor-Zen - A minimalistic dark theme with muted colors
# Source: https://github.com/staffanob/tmux-toor-zen-theme

# ==============================================================================
# KEYBINDINGS
unbind C-b                          # Remap prefix to 'C-a'
set-option -g prefix C-Space
bind-key C-Space send-prefix        # Press twice sends key binding to app

# Reload Tmux Config
unbind r
bind r source-file ~/.tmux.conf \; run-shell ~/.tmux/plugins/tmux-toor-zen-theme/tmux-toor-zen-theme.tmux \; display "Config Reloaded!"

# Use vim-like keys for splits and windows in current path
bind-key v split-window -h -c "#{pane_current_path}"
bind-key s split-window -v -c "#{pane_current_path}"

# Shift Alt to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Vim like select and yank 
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind-key -T copy-mode-vi Enter send-keys -X copy-pipe 'xclip -i -sel p -f | xclip -i -sel c'
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe 'xclip -i -sel p -f | xclip -i -sel c'

# Resize modes with Alt + arrow keys
#  bind -n M-r switch-client -T resize
bind -n M-r switch-client -T resize \; display-message "RESIZE MODE"

bind -T resize -r h resize-pane -L 10 \; swwitch-client -T resize
bind -T resize -r l resize-pane -R 10 \; swwitch-client -T resize
bind -T resize -r j resize-pane -D 6 \; swwitch-client -T resize
bind -T resize -r k resize-pane -U 6 \; swwitch-client -T resize

bind -T resize -r Left  resize-pane -L 10 \; swwitch-client -T resize
bind -T resize -r Right resize-pane -R 10 \; swwitch-client -T resize
bind -T resize -r Down  resize-pane -D 6 \; swwitch-client -T resize
bind -T resize -r Up    resize-pane -U 6 \; swwitch-client -T resize

bind -T resize q      switch-client -T root
bind -T resize Escape switch-client -T rooh


# Open scripts
#bind-key -r i run-shell "tmux neww ~/.tmux/scripts/cht.sh"
#bind-key i run-shell "python3 /home/staffan/dotfiles/tmux/scripts/tmpr.py"
#bind-key S run-shell "python3 /home/staffan/dotfiles/tmux/scripts/tmpr.py save"

#bind-key F5 run-shell "python3 /home/staffan/dotfiles/tmux/scripts/tmpr.py"
#bind-key F6 run-shell "python3 /home/staffan/dotfiles/tmux/scripts/tmpr.py save"

# Open GitHub Copilot CLI in right pane (1/3 width)
bind-key g split-window -h -l 25% -c "#{pane_current_path}" "gemini" # "copilot"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run 'test -f ~/.tmux/plugins/tpm/tpm && ~/.tmux/plugins/tpm/tpm || true'
